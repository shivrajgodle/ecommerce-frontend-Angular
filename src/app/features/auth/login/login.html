<div class="auth-page">
  <app-card [padded]="true" class="auth-card">
    <h1>Welcome back</h1>
    <form (submit)="handleSubmit($event)">
      <app-input
        label="Email"
        type="email"
        [required]="true"
        [(value)]="email"
        [errorMessage]="emailError()"
      />
      <app-input
        label="Password"
        type="password"
        [required]="true"
        [(value)]="password"
        [errorMessage]="passwordError()"
      />
      <app-button type="submit" [loading]="submitting()">Sign in</app-button>
    </form>
    <p class="switch-link">New here? <a routerLink="/register">Create an account</a></p>
  </app-card>
</div>
