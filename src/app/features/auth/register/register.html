<div class="auth-page">
    <app-card [padded]="true" class="auth-card">
        <h1>Create your account</h1>
        <form (submit)="handleSubmit($event)">
            <app-input label="Full name" type="text" [required]="true" [(value)]="fullName"
                [errorMessage]="fullNameError()" />
            <app-input label="Email" type="email" [required]="true" [(value)]="email" [errorMessage]="emailError()" />
            <app-input label="Password" type="password" [required]="true" [(value)]="password"
                [errorMessage]="passwordError()" />
            <app-button type="submit" [loading]="submitting()">Create account</app-button>
        </form>
        <p class="switch-link">Already have an account? <a routerLink="/login">Sign in</a></p>
    </app-card>
</div>
